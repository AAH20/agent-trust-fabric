name: Verify reference kernel

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_trust_fabric.cli benchmark fixtures/refund-agent.json
      - run: python -m agent_trust_fabric.cli run fixtures/refund-agent.json --output /tmp/agent-passport.json
      - run: python -m agent_trust_fabric.cli verify /tmp/agent-passport.json --case fixtures/refund-agent.json
      - run: python -m agent_trust_fabric.cli simulate fixtures/support-rollout-scenario.json --output /tmp/support-simulation.json
