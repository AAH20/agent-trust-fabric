[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2z-agent-trust-fabric"
version = "0.1.0"
description = "Framework-neutral agent authority and evidence reference kernel"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
agent-trust = "agent_trust_fabric.cli:main"

[tool.setuptools.packages.find]
include = ["agent_trust_fabric*"]
